# Simple allocation: any 2 Spyre cards.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: spyre-simple-claim
spec:
  spec:
    devices:
      requests:
      - name: spyre
        exactly:
          deviceClassName: spyre-pf
          count: 2                 # number of Spyres (default: 1)
