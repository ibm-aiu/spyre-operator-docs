#
# Combined NetworkPolicy manifest for the Spyre Operator.
# Apply with:
#   oc apply -f spyre-network-policies.yaml
#
# See docs/admin-guide/network-security-guide.md for the full explanation of
# each policy, port reference, and customization guidance.
#
# IMPORTANT: Before applying, review the ipBlock CIDRs for the API server
# policies (spyre-operator-policy, webhook-validator-policy) and narrow them
# to the actual CIDR of your control-plane nodes.
# Use:  oc get nodes -l node-role.kubernetes.io/master -o wide

---
# card-management-policy
# Card management communicates through Unix-domain sockets only (no TCP port).
# Only pods in the same namespace may initiate connections; all external ingress
# is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: card-management-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: cardmgmt
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}

---
# metrics-exporter-policy
# Port 8082 (default) is scraped by Prometheus in openshift-monitoring only.
# Adjust the port if .spec.metricsExporter.port was changed in SpyreClusterPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-exporter-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-metrics-exporter
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - protocol: TCP
      port: 8082

---
# health-checker-policy
# Port 8080: liveness/readiness probes called by kubelet (host network).
# Port 8081: Prometheus metrics scraped by openshift-monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: health-checker-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-health-checker
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0  # narrow to node subnet if known, e.g. 192.168.0.0/24
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - protocol: TCP
      port: 8081

---
# webhook-validator-policy
# Port 9443 (admission webhook TLS) must be reachable by the Kubernetes API
# server only. Narrow the CIDR to your control-plane node IPs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-validator-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-webhook-validator
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0  # narrow to control-plane node CIDR, e.g. 10.0.0.0/24
    ports:
    - protocol: TCP
      port: 9443

---
# device-plugin-policy
# Device plugin uses Unix-domain sockets only. No TCP ingress permitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-plugin-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-device-plugin-daemonset
  policyTypes:
  - Ingress

---
# dra-driver-policy
# DRA driver uses Unix-domain sockets only. No TCP ingress permitted.
# Apply this when using the DRA driver (.spec.devicePlugin.mode: dra).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dra-driver-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: dra-driver-spyre
  policyTypes:
  - Ingress

---
# spyre-operator-policy
# Port 8443 (operator metrics / leader-election webhook) is accessed by the
# Kubernetes API server only. Narrow the CIDR to your control-plane node IPs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spyre-operator-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-operator
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0  # narrow to control-plane node CIDR, e.g. 10.0.0.0/24
    ports:
    - protocol: TCP
      port: 8443
