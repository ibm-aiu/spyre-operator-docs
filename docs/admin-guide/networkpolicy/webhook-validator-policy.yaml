# Restricts ingress to the webhook-validator pods.
# Port 9443 (HTTPS/TLS) must be reachable by the Kubernetes API server only.
# The API server runs on the host network of control-plane nodes; set the cidr
# to the CIDR of your control-plane nodes to tighten this policy.
# Use: oc get nodes -l node-role.kubernetes.io/master -o wide
# to discover control-plane node IPs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-validator-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-webhook-validator
  policyTypes:
  - Ingress
  ingress:
  # Allow the Kubernetes API server to reach the admission webhook
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0  # narrow to control-plane node CIDR, e.g. 10.0.0.0/24
    ports:
    - protocol: TCP
      port: 9443
