# Topology aware allocation: 4 Spyre cards at most one PCI hop away (tier1).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: spyre-tier1-claim
spec:
  spec:
    devices:
      requests:
      - name: spyre
        exactly:
          deviceClassName: spyre-pf
          count: 4
      constraints:
      - requests: ["spyre"]
        matchAttribute: spyre.ibm.com/tier1Group
