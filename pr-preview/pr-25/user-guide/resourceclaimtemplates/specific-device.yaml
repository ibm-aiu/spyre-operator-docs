# Specific device allocation (debug purpose): the card at PCI address 0000:1a:00.0.
# Replace the address with the one found in the ResourceSlice.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: spyre-specific-claim
spec:
  spec:
    devices:
      requests:
      - name: spyre
        exactly:
          deviceClassName: spyre-pf
          selectors:
          - cel:
              expression: |-
                device.attributes["spyre.ibm.com"].pciAddress == "0000:1a:00.0"
