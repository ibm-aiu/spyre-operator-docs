# Restricts ingress to the metrics-exporter pods.
# Only Prometheus pods in the openshift-monitoring namespace may scrape the
# metrics endpoint on port 8082 (the default; adjust if .spec.metricsExporter.port
# was changed in SpyreClusterPolicy).
#
# To also allow scraping from a custom monitoring namespace, uncomment and
# adjust the second ingress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-exporter-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-metrics-exporter
  policyTypes:
  - Ingress
  ingress:
  # Allow Prometheus scraping from the OpenShift monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - protocol: TCP
      port: 8082
  # Allow scraping from a custom monitoring namespace (optional)
  # - from:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: <your-monitoring-namespace>
  #   ports:
  #   - protocol: TCP
  #     port: 8082
