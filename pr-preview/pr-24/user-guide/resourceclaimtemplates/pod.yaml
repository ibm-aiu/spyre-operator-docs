# Pod consuming a ResourceClaimTemplate.
# Replace resourceClaimTemplateName with the name of the template to use
# (e.g. spyre-simple-claim, spyre-specific-claim, spyre-tier0-claim).
# Note: schedulerName is not needed with DRA.
apiVersion: v1
kind: Pod
metadata:
  name: dra-spyre-job
spec:
  containers:
    - name: app
      image: registry.access.redhat.com/ubi9/ubi:latest
      command: ["tail", "-f", "/dev/null"]
      resources:
        claims:
          - name: spyre
  resourceClaims:
    - name: spyre
      resourceClaimTemplateName: spyre-simple-claim
