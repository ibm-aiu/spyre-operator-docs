# Denies all ingress to the device-plugin pods.
# The device plugin communicates with the kubelet exclusively through Unix-domain
# sockets on the host node filesystem (/var/lib/kubelet/device-plugins/).
# It does not listen on any TCP port, so all network ingress is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-plugin-policy
  namespace: spyre-operator
spec:
  podSelector:
    matchLabels:
      app: spyre-device-plugin-daemonset
  policyTypes:
  - Ingress
  # No ingress rules — all TCP ingress is denied
