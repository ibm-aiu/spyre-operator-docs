apiVersion: spyre.ibm.com/v1alpha1
kind: SpyreClusterPolicy
metadata:
  name: spyreclusterpolicy
spec:
  devicePlugin:
    mode: dra
    repository: "ghcr.io/ibm-aiu"
    image: "dra-driver-spyre"
    version: 1.5.0-dev
    configPath: /etc/aiu
    configName: senlib_config.json
  podValidator:
    enabled: true
    repository: "ghcr.io/ibm-aiu"
    image: "spyre-webhook-validator"
    version: 1.5.0-dev
  metricsExporter:
    enabled: true
    repository: "ghcr.io/ibm-aiu"
    image: "spyre-metrics-exporter"
    version: 1.5.0-dev
  healthChecker:
    enabled: true
    repository: "ghcr.io/ibm-aiu"
    image: "spyre-health-checker"
    version: 1.5.0-dev
